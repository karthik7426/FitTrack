<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitTrack - Running Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            padding: 20px;
        }

        .app {
            max-width: 500px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #4ade80;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #9ca3af;
        }

        .card {
            background: #1f2937;
            padding: 22px;
            border-radius: 18px;
            margin-top: 20px;
        }

        .card h2 {
            font-size: 18px;
            color: #d1d5db;
        }

        .distance {
            font-size: 55px;
            font-weight: bold;
            margin: 15px 0;
        }

        .distance span {
            font-size: 20px;
            color: #9ca3af;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat {
            background: #374151;
            padding: 18px;
            border-radius: 14px;
        }

        .stat h3 {
            color: #9ca3af;
            font-size: 14px;
        }

        .stat p {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        #startBtn {
            background: #4ade80;
            color: #101827;
        }

        #resetBtn {
            background: #374151;
            color: white;
        }

        #status {
            color: #9ca3af;
            text-align: center;
            margin-top: 15px;
        }

        footer {
            text-align: center;
            color: #6b7280;
            margin-top: 25px;
            font-size: 13px;
        }
    </style>
</head>
<link rel="manifest" href="./manifest.json">
<body>

<div class="app">

    <header>
        <div>
            <h1>FitTrack 🏃</h1>
            <p class="subtitle">Your fitness journey starts here</p>
        </div>
        <div style="font-size: 35px;">💚</div>
    </header>

    <div class="card">
        <h2>Today's Running</h2>

        <div class="distance">
            <span id="distance">0.00</span>
            <span>km</span>
        </div>

        <p class="subtitle">Total Distance</p>
    </div>

    <div class="stats">

        <div class="stat">
            <h3>⏱️ Duration</h3>
            <p id="time">00:00:00</p>
        </div>

        <div class="stat">
            <h3>🔥 Calories</h3>
            <p id="calories">0 kcal</p>
        </div>

        <div class="stat">
            <h3>🏃 Pace</h3>
            <p id="pace">-- min/km</p>
        </div>

        <div class="stat">
            <h3>📍 Status</h3>
            <p id="runStatus">Ready</p>
        </div>

    </div>

    <button id="startBtn" onclick="startRun()">
        Start Running
    </button>

    <button id="resetBtn" onclick="resetRun()">
        Reset Workout
    </button>

    <p id="status">Ready to start your workout!</p>

    <footer>
        FitTrack | Keep moving, keep growing 💚
    </footer>

</div>

<script>
    let running = false;
    let startTime = 0;
    let timer = null;

    function startRun() {
        if (running) {
            stopRun();
            return;
        }

        running = true;
        startTime = Date.now();
        startGpsTracking();

        document.getElementById("startBtn").innerText =
            "Stop Running";

        document.getElementById("runStatus").innerText =
            "Running";

        document.getElementById("status").innerText =
            "Workout started!";

        timer = setInterval(updateTime, 1000);
    }

    function updateTime() {
        let seconds = Math.floor(
            (Date.now() - startTime) / 1000
        );

        let hours = Math.floor(seconds / 3600);
        let minutes = Math.floor((seconds % 3600) / 60);
        let remainingSeconds = seconds % 60;

        document.getElementById("time").innerText =
            String(hours).padStart(2, "0") + ":" +
            String(minutes).padStart(2, "0") + ":" +
            String(remainingSeconds).padStart(2, "0");
    }

    function stopRun() {
        running = false;
        clearInterval(timer);
        stopGpsTracking();

        document.getElementById("startBtn").innerText =
            "Start Running";

        document.getElementById("runStatus").innerText =
            "Stopped";

        document.getElementById("status").innerText =
            "Workout stopped.";
    }

    function resetRun() {
        stopRun();

        startTime = 0;

        document.getElementById("distance").innerText = "0.00";
        document.getElementById("time").innerText = "00:00:00";
        document.getElementById("calories").innerText = "0 kcal";
        document.getElementById("pace").innerText = "-- min/km";
        document.getElementById("runStatus").innerText = "Ready";
        document.getElementById("status").innerText =
            "Ready to start your workout!";
    }
</script>
<script src="gps.js"></script>
</body>
    <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js');
}
</script>
</html>
